name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy 30Nice Growth OS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          script: |
            set -e

            PROD_DIR=/var/www/30nice-growth-os
            SOURCE_DIR="$(mktemp -d /tmp/30nice-growth-os.XXXXXX)"
            trap 'rm -rf "$SOURCE_DIR"' EXIT

            echo "=== [1/4] Checkout main into a temporary release directory ==="
            git clone --depth 1 --branch main \
              https://github.com/phanthuanxp/30nice-growth-os.git \
              "$SOURCE_DIR"

            echo "=== [2/4] Sync source to production ==="
            rsync -av --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env' \
              --exclude='.env.local' \
              --exclude='.deploy-backups' \
              --exclude='30nice-upgrade-v2-full.tar.gz' \
              "$SOURCE_DIR/" "$PROD_DIR/"

            echo "=== [3/4] Backup, migrate, build, and restart ==="
            cd "$PROD_DIR"
            bash deploy/deploy.sh

            echo "=== [4/4] Health check ==="
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              http://127.0.0.1:3001/login >/dev/null
            echo "Health check passed: http://127.0.0.1:3001/login"
