name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy 30Nice Growth OS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 300s
          script: |
            set -e

            PROD_DIR=/var/www/30nice-growth-os
            SOURCE_DIR="$(mktemp -d /tmp/30nice-growth-os.XXXXXX)"
            trap 'rm -rf "$SOURCE_DIR"' EXIT

            echo "=== [1/4] Checkout main into a temporary release directory ==="
            git clone --depth 1 --branch main \
              https://github.com/phanthuanxp/30nice-growth-os.git \
              "$SOURCE_DIR"

            echo "=== [2/4] Sync source to production ==="
            rsync -av --delete \
              --exclude='.git' \
              --exclude='node_modules' \
              --exclude='.next' \
              --exclude='.env' \
              --exclude='.env.local' \
              --exclude='.deploy-backups' \
              --exclude='30nice-upgrade-v2-full.tar.gz' \
              "$SOURCE_DIR/" "$PROD_DIR/"

            echo "=== [3/4] Backup, migrate, build, and restart ==="
            cd "$PROD_DIR"
            bash deploy/deploy.sh

            echo "=== [4/4] Health checks ==="
            set -a
            # shellcheck disable=SC1091
            . ./.env
            set +a
            APP_PORT="${PORT:-3001}"
            curl --fail --silent --show-error \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "http://127.0.0.1:${APP_PORT}/login" >/dev/null
            echo "Public health check passed on port ${APP_PORT}."

            SMOKE_TOKEN="$(node <<'NODE'
            const { createHmac } = require("node:crypto");
            const user = {
              id: "deploy-smoke-test",
              name: "Deploy Smoke Test",
              email: "deploy-smoke@30nice.vn",
              role: "SUPER_ADMIN",
            };
            const payload = Buffer.from(JSON.stringify(user)).toString("base64url");
            const signature = createHmac("sha256", process.env.SESSION_SECRET)
              .update(payload)
              .digest("base64url");
            process.stdout.write(`${payload}.${signature}`);
            NODE
            )"
            for ADMIN_PATH in \
              /admin/dashboard \
              /admin/social \
              /admin/social/planner \
              /admin/social/calendar
            do
              SAFE_NAME="$(printf '%s' "$ADMIN_PATH" | tr '/' '-')"
              ADMIN_STATUS="$(curl --silent --show-error \
                --output "/tmp/30nice-${SAFE_NAME}-smoke.html" \
                --write-out '%{http_code}' \
                --header "Cookie: 30nice_session=${SMOKE_TOKEN}" \
                "http://127.0.0.1:${APP_PORT}${ADMIN_PATH}")"
              if [ "$ADMIN_STATUS" != "200" ]; then
                echo "Authenticated health check for ${ADMIN_PATH} failed with HTTP ${ADMIN_STATUS}." >&2
                pm2 logs 30nice-growth-os --lines 200 --nostream >&2 || true
                exit 1
              fi
              echo "Authenticated health check passed for ${ADMIN_PATH}."
            done
