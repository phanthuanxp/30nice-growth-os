name: Deploy to VPS

# Manual only. Deploys a git ref through deploy/deploy.sh, which backs up
# production and the database first and never touches .env*, .data/ or uploads.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: true
        default: "origin/main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy GFVGO
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_REF: ${{ inputs.ref }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_REF
          timeout: 300s
          command_timeout: 30m
          script: |
            set -e
            SRC_DIR=/srv/gfvgo-src
            if [ ! -d "$SRC_DIR/.git" ]; then
              git clone https://github.com/phanthuanxp/30nice-growth-os.git "$SRC_DIR"
            fi
            cd "$SRC_DIR"
            git fetch --quiet --prune origin
            git checkout --quiet --detach "$DEPLOY_REF"
            bash deploy/deploy.sh "$DEPLOY_REF"
