name: Social Page Publisher

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish due Facebook Page posts
        run: |
          HTTP_STATUS="$(curl --silent --show-error \
            --output /tmp/social-publish.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://admin.30nice.vn/api/cron/social-publish)"
          cat /tmp/social-publish.json
          test "$HTTP_STATUS" = "200"
